<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ff6f91">
<title>A Little Message For You ❤️</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  body {
    overflow: hidden;
    background: radial-gradient(circle at top, #ffeef4 0%, #ffc4d6 45%, #ff8fab 100%);
    color: #6b1835;
  }

  .scene {
    min-height: 100vh;
    display: grid;
    place-items: center;
    position: relative;
    padding: 24px;
    overflow: hidden;
  }

  .glow {
    position: absolute;
    width: 280px;
    height: 280px;
    border-radius: 50%;
    background: rgba(255,255,255,.35);
    filter: blur(35px);
    animation: pulse 3s ease-in-out infinite;
  }

  .card {
    position: relative;
    width: min(92vw, 430px);
    min-height: 560px;
    padding: 34px 25px;
    border-radius: 30px;
    background: rgba(255,255,255,.72);
    border: 1px solid rgba(255,255,255,.8);
    box-shadow: 0 25px 70px rgba(120, 24, 62, .22);
    backdrop-filter: blur(12px);
    text-align: center;
    z-index: 5;
    animation: cardIn 1s cubic-bezier(.2,.8,.2,1);
  }

  .small {
    margin-top: 4px;
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: .7;
  }

  .envelope-wrap {
    height: 220px;
    display: grid;
    place-items: center;
    perspective: 900px;
  }

  .envelope {
    position: relative;
    width: 220px;
    height: 145px;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform .5s ease;
    filter: drop-shadow(0 18px 15px rgba(117, 22, 57, .18));
  }

  .env-back, .env-front {
    position: absolute;
    inset: 0;
    border-radius: 12px;
  }

  .env-back {
    background: #fff;
  }

  .env-front {
    background: #ff6f91;
    clip-path: polygon(0 0, 50% 58%, 100% 0, 100% 100%, 0 100%);
    z-index: 3;
  }

  .flap {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #ff9db4;
    clip-path: polygon(0 0, 100% 0, 50% 58%);
    transform-origin: top center;
    z-index: 4;
    transition: transform .9s cubic-bezier(.2,.8,.2,1);
  }

  .letter {
    position: absolute;
    left: 12%;
    width: 76%;
    height: 115px;
    bottom: 15px;
    background: #fffafc;
    border-radius: 8px;
    padding: 18px 10px;
    z-index: 2;
    transition: transform 1s cubic-bezier(.2,.8,.2,1);
    box-shadow: 0 5px 15px rgba(100,0,30,.1);
    font-size: 24px;
    font-weight: 700;
  }

  .envelope.open .flap {
    transform: rotateX(180deg);
  }

  .envelope.open .letter {
    transform: translateY(-90px);
  }

  .tap {
    margin: -4px 0 0;
    font-size: 14px;
    opacity: .65;
  }

  .message {
    opacity: 0;
    transform: translateY(20px);
    pointer-events: none;
    transition: opacity .8s ease .5s, transform .8s ease .5s;
  }

  .message.show {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  h1 {
    margin: 12px 0 8px;
    font-size: clamp(40px, 12vw, 62px);
    line-height: .95;
    color: #d92f62;
    text-shadow: 0 5px 18px rgba(217,47,98,.18);
    animation: heartbeat 1.4s ease-in-out infinite;
  }

  .heart {
    display: inline-block;
  }

  .message p {
    margin: 12px auto;
    max-width: 330px;
    font-size: 17px;
    line-height: 1.6;
  }

  .signature {
    margin-top: 18px;
    font-weight: 700;
    font-size: 16px;
  }

  button {
    margin-top: 18px;
    border: 0;
    border-radius: 999px;
    padding: 12px 20px;
    background: #d92f62;
    color: white;
    font-size: 14px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(217,47,98,.25);
  }

  button:active { transform: scale(.96); }

  .particle {
    position: absolute;
    bottom: -50px;
    font-size: 22px;
    pointer-events: none;
    animation: floatUp linear forwards;
    z-index: 2;
  }

  .sparkle {
    position: absolute;
    font-size: 18px;
    animation: sparkle 1.8s ease-in-out infinite;
    z-index: 1;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(35px) scale(.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes pulse {
    0%,100% { transform: scale(.85); opacity: .55; }
    50% { transform: scale(1.1); opacity: .8; }
  }

  @keyframes heartbeat {
    0%,100% { transform: scale(1); }
    15% { transform: scale(1.06); }
    30% { transform: scale(1); }
  }

  @keyframes floatUp {
    from { transform: translateY(0) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    to { transform: translateY(-115vh) rotate(25deg); opacity: 0; }
  }

  @keyframes sparkle {
    0%,100% { opacity: .15; transform: scale(.7) rotate(0); }
    50% { opacity: 1; transform: scale(1.3) rotate(20deg); }
  }
</style>
</head>

<body>
<div class="scene" id="scene">
  <div class="glow"></div>

  <div class="sparkle" style="left:10%;top:15%">✦</div>
  <div class="sparkle" style="right:13%;top:25%;animation-delay:.5s">✧</div>
  <div class="sparkle" style="left:17%;bottom:18%;animation-delay:1s">✦</div>
  <div class="sparkle" style="right:18%;bottom:15%;animation-delay:1.4s">✧</div>

  <main class="card">
    <div class="small">A little surprise for you</div>

    <div class="envelope-wrap">
      <div class="envelope" id="envelope" aria-label="Open the envelope">
        <div class="env-back"></div>
        <div class="letter">💌</div>
        <div class="env-front"></div>
        <div class="flap"></div>
      </div>
    </div>

    <div class="tap" id="tapText">Tap the envelope ❤️</div>

    <section class="message" id="message">
      <h1>I LOVE YOU <span class="heart">❤️</span></h1>

      <p>
        Just a little reminder that you mean so much to me.
        I hope this tiny surprise makes you smile today. ✨
      </p>

      <div class="signature">— From someone who cares about you 💕</div>

      <button id="again">Replay ✨</button>
    </section>
  </main>
</div>

<script>
  const envelope = document.getElementById("envelope");
  const message = document.getElementById("message");
  const tapText = document.getElementById("tapText");
  const again = document.getElementById("again");
  const scene = document.getElementById("scene");

  function burst() {
    const symbols = ["❤️", "💕", "💗", "✨", "💖", "♡"];
    for (let i = 0; i < 28; i++) {
      const p = document.createElement("div");
      p.className = "particle";
      p.textContent = symbols[Math.floor(Math.random() * symbols.length)];
      p.style.left = Math.random() * 100 + "%";
      p.style.animationDuration = (4 + Math.random() * 4) + "s";
      p.style.animationDelay = (Math.random() * 1.5) + "s";
      p.style.fontSize = (16 + Math.random() * 18) + "px";
      scene.appendChild(p);
      setTimeout(() => p.remove(), 9000);
    }
  }

  function openMessage() {
    envelope.classList.add("open");
    tapText.textContent = "Open your little surprise 💌";
    setTimeout(() => {
      message.classList.add("show");
      tapText.textContent = "Made with love ❤️";
      burst();
    }, 750);
  }

  envelope.addEventListener("click", openMessage);

  again.addEventListener("click", () => {
    message.classList.remove("show");
    envelope.classList.remove("open");
    tapText.textContent = "Tap the envelope ❤️";
    setTimeout(openMessage, 500);
  });
</script>
</body>
</html>
